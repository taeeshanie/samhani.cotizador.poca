<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Samahani Cotizador</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    /* =========================
       PÁGINA
    ========================= */

    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;

      font-family: Arial, sans-serif;

      overflow-x: hidden;

      position: relative;
    }


    /* =========================
       FONDO
       fondo.png
    ========================= */

    .fondo {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center;

      z-index: -1;

      pointer-events: none;

    }


    /* =========================
       CONTENIDO GENERAL
    ========================= */

    .pagina {

      width: 100%;
      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      padding: 20px 15px 40px;

    }


    /* =========================
       DECORACIÓN
       decoracion.png
    ========================= */

    .decoracion {

      width: min(850px, 95vw);

      position: relative;

      z-index: 2;

      margin-bottom: -30px;

    }

    .decoracion img {

      display: block;

      width: 100%;

      height: auto;

    }


    /* =========================
       PLATO
       plato.png
    ========================= */

    .zona-cotizador {

      width: min(800px, 95vw);

      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;

    }

    .plato {

      display: block;

      width: 100%;

      height: auto;

      pointer-events: none;

    }


    /* =========================
       COTIZADOR
       SIN FONDO PROPIO
    ========================= */

    .cotizador {

      position: absolute;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      width: 55%;

      text-align: center;

    }


    /* =========================
       INPUT
    ========================= */

    .campo-precio {

      position: relative;

      width: 100%;

    }

    #precioUSD {

      width: 100%;

      padding: 18px 60px 18px 20px;

      border: 2px solid #9b2924;

      border-radius: 18px;

      background: rgba(255, 255, 255, 0.45);

      color: #6d2a25;

      font-family: "Yeseva One", serif;

      font-size: 23px;

      outline: none;

    }

    #precioUSD::placeholder {

      color: #777;

    }

    #precioUSD:focus {

      border-color: #7d1f1b;

    }


    .dolar {

      position: absolute;

      right: 20px;

      top: 50%;

      transform: translateY(-50%);

      color: #92251f;

      font-family: "Yeseva One", serif;

      font-size: 32px;

      pointer-events: none;

    }


    /* =========================
       BOTÓN
    ========================= */

    button {

      width: 100%;

      margin-top: 18px;

      padding: 18px;

      border: none;

      border-radius: 18px;

      background: #4f7d13;

      color: white;

      font-family: "Yeseva One", serif;

      font-size: 23px;

      cursor: pointer;

      box-shadow: 0 5px 0 #35580c;

      transition: 0.2s;

    }

    button:hover {

      transform: translateY(-2px);

    }

    button:active {

      transform: translateY(3px);

      box-shadow: 0 2px 0 #35580c;

    }


    /* =========================
       SEPARADOR
    ========================= */

    .separador {

      border-top: 2px dotted #a22c26;

      margin: 28px 0 22px;

    }


    /* =========================
       RESULTADO
    ========================= */

    #resultado {

      display: none;

      width: 100%;

      padding: 25px 10px;

      border: 2px dashed #a22c26;

      border-radius: 20px;

      color: #92251f;

      font-family: "Yeseva One", serif;

      font-size: 42px;

    }


    /* =========================
       ERROR
    ========================= */

    #error {

      display: none;

      margin-top: 15px;

      color: #9b2924;

      font-weight: bold;

      font-size: 14px;

    }


    /* =========================
       TEXTO INFERIOR
    ========================= */

    #aviso {

      display: none;

      width: min(650px, 90vw);

      margin-top: 20px;

      padding: 10px 20px;

      text-align: center;

      color: #6d2a25;

      font-size: 14px;

      font-weight: bold;

      line-height: 1.5;

    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      .pagina {

        padding-top: 10px;

      }


      .decoracion {

        width: 100vw;

        margin-bottom: -15px;

      }


      .zona-cotizador {

        width: 120vw;

      }


      .cotizador {

        width: 48%;

      }


      #precioUSD {

        padding: 13px 40px 13px 12px;

        border-radius: 13px;

        font-size: 15px;

      }


      .dolar {

        right: 12px;

        font-size: 22px;

      }


      button {

        margin-top: 12px;

        padding: 13px;

        border-radius: 13px;

        font-size: 16px;

      }


      .separador {

        margin: 18px 0 14px;

      }


      #resultado {

        padding: 16px 5px;

        border-radius: 15px;

        font-size: 27px;

      }


      #error {

        font-size: 11px;

      }


      #aviso {

        margin-top: 5px;

        font-size: 12px;

        padding: 10px;

      }

    }

  </style>

</head>


<body>


  <!-- FONDO COMPLETO -->

  <img
    class="fondo"
    src="./fondo.png"
    alt=""
  >


  <main class="pagina">


    <!-- DECORACIÓN SUPERIOR -->

    <div class="decoracion">

      <img
        src="./decoracion.png"
        alt="Samahani Cotizador"
      >

    </div>


    <!-- PLATO Y COTIZADOR -->

    <div class="zona-cotizador">


      <img
        class="plato"
        src="./plato.png"
        alt=""
      >


      <div class="cotizador">


        <div class="campo-precio">

          <input
            type="number"
            id="precioUSD"
            placeholder="Precio en USD"
            min="0"
            step="0.01"
          >

          <span class="dolar">$</span>

        </div>


        <button onclick="cotizar()">

          COTIZAR

        </button>


        <div class="separador"></div>


        <div id="resultado"></div>


        <div id="error">

          Ingresá un precio válido.

        </div>


      </div>


    </div>


    <!-- TEXTO DESPUÉS DE COTIZAR -->

    <div id="aviso">

      La cotización ya incluye envío a casilla coreana,
      faltan envío e impuestos argentinos.

    </div>


  </main>


  <script>

    function cotizar() {

      const precio = parseFloat(
        document.getElementById("precioUSD").value
      );

      const resultado =
        document.getElementById("resultado");

      const error =
        document.getElementById("error");

      const aviso =
        document.getElementById("aviso");


      if (isNaN(precio) || precio <= 0) {

        resultado.style.display = "none";

        aviso.style.display = "none";

        error.style.display = "block";

        return;

      }


      error.style.display = "none";


      /* DÓLAR A $1600 - SIN FEES */

      const totalARS = precio * 1600;


      resultado.innerHTML =
        "$ " +
        totalARS.toLocaleString(
          "es-AR",
          {
            maximumFractionDigits: 0
          }
        );


      resultado.style.display = "block";

      aviso.style.display = "block";

    }


    document
      .getElementById("precioUSD")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            cotizar();

          }

        }
      );

  </script>


</body>
</html>
