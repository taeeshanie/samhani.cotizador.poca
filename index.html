<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Samahani Cotizador</title>

  <!-- FUENTE YESEVA ONE -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    /* =========================
       FONDO
       ========================= */

    body {

      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      font-family: "Yeseva One", serif;

      /* PRIMERA IMAGEN */
      background-image: url("./fondo.png");

      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;

      background-color: #35610d;

      overflow-x: hidden;

      padding-bottom: 50px;

    }


    /* =========================
       DECORACIÓN / LOGO
       SEGUNDA IMAGEN
       ========================= */

    .decoracion {

      width: min(90vw, 900px);

      margin-top: 15px;

      display: flex;
      justify-content: center;

      position: relative;
      z-index: 2;

    }

    .decoracion img {

      width: 100%;
      height: auto;

      display: block;

    }


    /* =========================
       CONTENEDOR DEL PLATO
       ========================= */

    .contenedor-plato {

      position: relative;

      width: min(92vw, 850px);

      margin-top: -10px;

      display: flex;
      justify-content: center;
      align-items: center;

    }


    /* =========================
       TERCERA IMAGEN: PLATO
       ========================= */

    .plato {

      width: 100%;
      height: auto;

      display: block;

      position: relative;

      z-index: 1;

      pointer-events: none;

    }


    /* =========================
       COTIZADOR
       VA SOBRE EL CENTRO DEL PLATO
       ========================= */

    .cotizador {

      position: absolute;

      z-index: 2;

      width: 58%;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      display: flex;
      flex-direction: column;

      align-items: center;

      text-align: center;

    }


    /* =========================
       INPUT
       ========================= */

    .input-contenedor {

      position: relative;

      width: 100%;

    }


    .input-usd {

      width: 100%;

      padding: 20px 65px 20px 22px;

      border: 2px solid #a32622;

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.75);

      color: #555;

      font-family: "Yeseva One", serif;

      font-size: 24px;

      outline: none;

    }


    .input-usd::placeholder {

      color: #777;

      opacity: 1;

    }


    .input-usd:focus {

      border-color: #8f1f1b;

      box-shadow:
        0 0 0 4px
        rgba(163, 38, 34, 0.12);

    }


    /* SIGNO $ */

    .simbolo {

      position: absolute;

      right: 22px;
      top: 50%;

      transform: translateY(-50%);

      color: #99241f;

      font-size: 36px;

      pointer-events: none;

    }


    /* =========================
       BOTÓN
       ========================= */

    .boton-cotizar {

      width: 100%;

      margin-top: 20px;

      padding: 20px;

      border: none;

      border-radius: 20px;

      background: linear-gradient(
        135deg,
        #628f20,
        #3f6810
      );

      color: white;

      font-family: "Yeseva One", serif;

      font-size: 25px;

      cursor: pointer;

      box-shadow: 0 6px 0 #31510d;

      transition: 0.15s ease;

    }


    .boton-cotizar:hover {

      transform: translateY(-2px);

    }


    .boton-cotizar:active {

      transform: translateY(4px);

      box-shadow: 0 2px 0 #31510d;

    }


    /* =========================
       SEPARADOR
       ========================= */

    .separador {

      width: 100%;

      border-top: 2px dotted #b02d28;

      margin: 30px 0 25px;

    }


    /* =========================
       RESULTADO
       ========================= */

    .resultado {

      width: 100%;

      display: none;

      padding: 25px 15px;

      border: 2px dashed #a52b25;

      border-radius: 22px;

      color: #92251f;

      background: rgba(255, 255, 255, 0.25);

      font-size: 45px;

      text-align: center;

      word-break: break-word;

    }


    /* =========================
       ERROR
       ========================= */

    .error {

      display: none;

      margin-top: 18px;

      color: #9c201c;

      font-family: Arial, sans-serif;

      font-size: 15px;

      font-weight: bold;

      text-align: center;

    }


    /* =========================
       AVISO
       DEBAJO DEL PLATO
       ========================= */

    .aviso {

      display: none;

      width: min(88vw, 650px);

      margin-top: 10px;

      padding: 10px 20px;

      color: #7d211d;

      background: rgba(255, 255, 255, 0.65);

      border-radius: 15px;

      font-family: Arial, sans-serif;

      font-size: 15px;

      font-weight: bold;

      line-height: 1.6;

      text-align: center;

      position: relative;
      z-index: 3;

    }


    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 600px) {

      body {

        background-image: url("./fondo.png");

        background-size: cover;

        background-position: center top;

        background-repeat: no-repeat;

        background-attachment: scroll;

        padding-bottom: 40px;

      }


      .decoracion {

        width: 96vw;

        margin-top: 10px;

      }


      /*
       El plato se hace más grande
       que la pantalla para que el
       cotizador entre cómodamente
      */

      .contenedor-plato {

        width: 125vw;

        max-width: none;

        margin-top: -5px;

      }


      .cotizador {

        width: 48%;

      }


      .input-usd {

        padding: 14px 42px 14px 12px;

        border-radius: 14px;

        font-size: 15px;

      }


      .simbolo {

        right: 13px;

        font-size: 24px;

      }


      .boton-cotizar {

        margin-top: 13px;

        padding: 14px;

        border-radius: 14px;

        font-size: 16px;

        box-shadow: 0 4px 0 #31510d;

      }


      .separador {

        margin: 20px 0 16px;

      }


      .resultado {

        padding: 18px 8px;

        border-radius: 15px;

        font-size: 27px;

      }


      .error {

        font-size: 11px;

      }


      .aviso {

        width: 88vw;

        margin-top: -5px;

        font-size: 12px;

        line-height: 1.5;

      }

    }


    /* =========================
       CELULARES MUY PEQUEÑOS
       ========================= */

    @media (max-width: 380px) {

      .contenedor-plato {

        width: 135vw;

      }

      .cotizador {

        width: 46%;

      }

      .input-usd {

        font-size: 13px;

      }

      .boton-cotizar {

        font-size: 14px;

      }

      .resultado {

        font-size: 23px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       SEGUNDA IMAGEN:
       DECORACIÓN
       ========================= -->

  <div class="decoracion">

    <img
      src="./decoracion.png"
      alt="Samahani Cotizador"
    >

  </div>


  <!-- =========================
       PLATO + COTIZADOR
       ========================= -->

  <div class="contenedor-plato">


    <!-- TERCERA IMAGEN: PLATO -->

    <img
      src="./plato.png"
      class="plato"
      alt=""
    >


    <!-- COTIZADOR -->

    <div class="cotizador">


      <!-- INPUT -->

      <div class="input-contenedor">

        <input
          type="number"
          id="precioUSD"
          class="input-usd"
          placeholder="Precio en USD"
          min="0"
          step="0.01"
        >

        <span class="simbolo">$</span>

      </div>


      <!-- BOTÓN -->

      <button
        class="boton-cotizar"
        type="button"
        onclick="cotizar()"
      >

        COTIZAR

      </button>


      <!-- SEPARADOR -->

      <div class="separador"></div>


      <!-- RESULTADO -->

      <div
        id="resultado"
        class="resultado"
      ></div>


      <!-- ERROR -->

      <div
        id="error"
        class="error"
      >

        Ingresá un precio válido.

      </div>


    </div>

  </div>


  <!-- =========================
       TEXTO DEBAJO DEL PLATO
       ========================= -->

  <div
    id="aviso"
    class="aviso"
  >

    La cotización ya incluye envío a casilla coreana,
    faltan envío e impuestos argentinos.

  </div>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    function cotizar() {

      const precio = parseFloat(
        document
          .getElementById("precioUSD")
          .value
      );


      /* DÓLAR FIJO */

      const dolar = 1600;


      const resultado =
        document.getElementById("resultado");

      const error =
        document.getElementById("error");

      const aviso =
        document.getElementById("aviso");


      /* VALIDACIÓN */

      if (
        isNaN(precio) ||
        precio <= 0
      ) {

        resultado.style.display = "none";

        aviso.style.display = "none";

        error.style.display = "block";

        return;

      }


      /* OCULTAR ERROR */

      error.style.display = "none";


      /*
       CÁLCULO

       SIN FEES
       PRECIO × 1600
      */

      const totalARS = precio * dolar;


      /* MOSTRAR RESULTADO */

      resultado.innerHTML =
        "$ " +
        totalARS.toLocaleString(
          "es-AR",
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
          }
        );


      resultado.style.display = "block";


      /* MOSTRAR AVISO */

      aviso.style.display = "block";

    }


    /* COTIZAR PRESIONANDO ENTER */

    document
      .getElementById("precioUSD")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            cotizar();

          }

        }
      );

  </script>

</body>

</html>
